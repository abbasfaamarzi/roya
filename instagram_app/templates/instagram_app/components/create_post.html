<div class="create-post-overlay" data-create-overlay hidden>
  <section class="create-post-dialog" role="dialog" aria-modal="true" aria-labelledby="create-post-title">
    <header><h2 id="create-post-title">ایجاد پست جدید</h2><button type="button" class="create-close" data-close-create aria-label="بستن">×</button></header>
    <form class="create-post-form">
      <label for="post-caption">توضیحات</label>
      <textarea id="post-caption" name="caption" rows="4" placeholder="چه چیزی در ذهن دارید؟"></textarea>
      <p class="create-post-hint">این نسخه نمایشی است؛ انتشار در سرور انجام نمی‌شود.</p>
      <button type="submit" class="publish-post">انتشار نمایشی</button>
    </form>
  </section>
</div>

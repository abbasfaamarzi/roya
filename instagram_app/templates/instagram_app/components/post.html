<article class="post-card" data-post-id="{{ index }}">
  <header class="post-header">
    <span class="post-avatar">{{ avatar_html|safe }}</span>
    <div class="post-author"><strong>{{ post.username }}</strong><small>{{ post.location }}</small></div>
    <button class="post-more" type="button" aria-label="گزینه‌های بیشتر">•••</button>
  </header>
  <button class="post-media" type="button" data-double-like aria-label="پسندیدن تصویر">
    {% if post.image %}<img src="{{ post.image }}" alt="{{ post.caption }}" loading="lazy">{% else %}<span class="image-placeholder">تصویر نمونه در پوشه images قرار دهید</span>{% endif %}
  </button>
  <div class="post-controls">
    <button class="post-like" type="button" aria-label="پسندیدن" aria-pressed="false">{{ like_button_html|safe }}<span class="fallback-icon">♡</span></button>
    <button class="post-comment-focus" type="button" aria-label="دیدگاه">◯</button>
    <button class="post-share" type="button" aria-label="اشتراک‌گذاری">➤</button>
    <button class="post-save" type="button" aria-label="ذخیره">♧</button>
  </div>
  <div class="post-caption">
    <strong class="post-likes">{{ post.likes }} پسند</strong>
    <p><b>{{ post.username }}</b> {{ post.caption }}</p>
    <button class="show-comments" type="button">مشاهده دیدگاه‌ها</button>
    <div class="comment-list" aria-live="polite"></div>
    <form class="comment-form"><input name="comment" placeholder="افزودن دیدگاه..." autocomplete="off" required><button type="submit">ارسال</button></form>
  </div>
</article>

<div id="{{ component.id }}" class="roya-virtual-list roya-component" data-roya-component="virtual_list"
     data-items="{{ items_json|escape }}" data-item-height="{{ item_height }}" data-overscan="{{ overscan }}"
     role="list" aria-label="{{ aria_label }}" aria-rowcount="{{ total_count }}">
  <div class="roya-virtual-list__viewport" tabindex="0">
    <div class="roya-virtual-list__spacer" style="height:{{ total_height }}px">
      <div class="roya-virtual-list__window"></div>
    </div>
  </div>
</div>

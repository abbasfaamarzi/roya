<label id="{{ component.id }}" class="roya-form-control roya-component" data-roya-component="select">
  {% if label %}<span class="roya-form-control__label">{{ label }}</span>{% endif %}
  <select class="roya-select" name="{{ field_name }}" {% if multiple %}multiple{% endif %}
    {% if disabled or readonly %}disabled{% endif %} {% if required %}required{% endif %}>
    {% if not multiple %}<option value="">انتخاب کنید</option>{% endif %}
    {% for item in items %}
    <option value="{% if item.value %}{{ item.value }}{% else %}{{ item }}{% endif %}"
      {% if item.value == value or item == value %}selected{% endif %}>
      {% if item.label %}{{ item.label }}{% elif item.name %}{{ item.name }}{% else %}{{ item }}{% endif %}
    </option>
    {% endfor %}
  </select>
</label>

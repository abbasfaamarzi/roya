<div id="{{ component.id }}" class="roya-textfield roya-textfield--{{ variant }} roya-component"
     data-roya-component="textfield">
  {% if label %}<label class="roya-textfield__label">{{ label }}</label>{% endif %}
  <div class="roya-textfield__input-wrap">
    {% if leading_icon %}<span class="roya-textfield__leading">{{ leading_icon }}</span>{% endif %}
    <input class="roya-textfield__input"
           type="{{ type }}"
           name="{{ field_name }}"
           value="{{ value }}"
           placeholder="{{ placeholder }}"
           {% if disabled %}disabled{% endif %}
           {% if required %}required{% endif %}
           {% if max_length %}maxlength="{{ max_length }}"{% endif %} />
    {% if trailing_icon %}<span class="roya-textfield__trailing">{{ trailing_icon }}</span>{% endif %}
  </div>
  {% if helper_text %}<small class="roya-textfield__helper">{{ helper_text }}</small>{% endif %}
  {% if error_text %}<small class="roya-textfield__error">{{ error_text }}</small>{% endif %}
</div>

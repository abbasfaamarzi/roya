<label id="{{ component.id }}" class="roya-checkbox roya-component" data-roya-component="checkbox">
  <input type="checkbox" name="{{ field_name }}" value="{{ value|default:'1' }}"
    {% if checked %}checked{% endif %} {% if indeterminate %}data-indeterminate="true"{% endif %}
    {% if disabled or readonly %}disabled{% endif %} {% if required %}required{% endif %}>
  <span>{{ label }}</span>
</label>

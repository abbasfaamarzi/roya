<span id="{{ component.id }}"
      class="roya-chip roya-chip--{{ variant }} roya-component"
      data-roya-component="chip">
  {% if leading_icon %}<span class="roya-chip__leading">{{ leading_icon }}</span>{% endif %}
  <span class="roya-chip__label">{{ label }}</span>
  {% if trailing_icon %}<span class="roya-chip__trailing">{{ trailing_icon }}</span>{% endif %}
</span>

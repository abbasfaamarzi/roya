<section id="{{ component.id }}" class="roya-bottom-sheet roya-component{% if open %} is-open{% endif %}" data-roya-component="bottom_sheet"
         data-dismissible="{{ dismissible|yesno:'true,false' }}" {% if not open %}hidden{% endif %}>
  {% if modal %}<button class="roya-bottom-sheet__backdrop" type="button" data-roya-sheet-dismiss aria-label="Close panel"></button>{% endif %}
  <div class="roya-bottom-sheet__panel" role="dialog" aria-modal="{{ modal|yesno:'true,false' }}" aria-label="{{ title }}" style="max-height:{{ max_height }}">
    <div class="roya-bottom-sheet__handle" aria-hidden="true"></div>
    {% if title %}<h2 class="roya-bottom-sheet__title">{{ title }}</h2>{% endif %}
    <div class="roya-bottom-sheet__content">{% for child in children %}{{ child.render }}{% endfor %}</div>
    {% if dismissible %}<button class="roya-bottom-sheet__close" type="button" data-roya-sheet-dismiss aria-label="Close">×</button>{% endif %}
  </div>
</section>

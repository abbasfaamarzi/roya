<div id="{{ component.id }}" class="roya-dialog roya-component"
     {% if not open %}hidden{% endif %}
     role="dialog" aria-modal="{{ modal|yesno:'true,false' }}"
     data-roya-component="dialog"
     data-dismissible="{{ dismissible|yesno:'true,false' }}"
     data-close-on-escape="{{ close_on_escape|yesno:'true,false' }}"
     data-close-on-outside="{{ close_on_outside|yesno:'true,false' }}"
     data-persistent="{{ persistent|yesno:'true,false' }}">
  <button type="button" class="roya-dialog__backdrop" aria-label="بستن پنجره"></button>
  <div class="roya-dialog__panel" style="max-width: {{ max_width }};">
    <button type="button" class="roya-dialog__close" data-roya-dialog-close aria-label="بستن">×</button>
    {% if title %}<h2 class="roya-dialog__title">{{ title }}</h2>{% endif %}
    {% if message %}<div class="roya-dialog__message">{{ message }}</div>{% endif %}
    <div class="roya-dialog__content">{% for child in children %}{{ child.render }}{% endfor %}</div>
  </div>
</div>

<nav id="{{ component.id }}" class="roya-nav-bar roya-component" data-roya-component="navigation_bar" aria-label="ناوبری اصلی">
  {% for item in items %}
  <button type="button" class="roya-nav-item{% if forloop.counter0 == active_item %} is-active{% endif %}"
    data-roya-nav-item data-value="{% if item.value %}{{ item.value }}{% elif item.label %}{{ item.label }}{% else %}{{ item }}{% endif %}"
    {% if forloop.counter0 == active_item %}aria-current="page"{% endif %}>
    <span class="roya-nav-item__icon" aria-hidden="true">{% if item.icon %}{{ item.icon }}{% else %}●{% endif %}</span>
    {% if show_labels %}<span class="roya-nav-item__label">{% if item.label %}{{ item.label }}{% else %}{{ item }}{% endif %}</span>{% endif %}
  </button>
  {% endfor %}
</nav>

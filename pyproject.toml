[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roya"
version = "0.2.0"
description = "Material Design 3 component library for Django"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Abbas Faamarzi" }]
dependencies = [
    "django>=4.2",
]

[project.urls]
Homepage = "https://github.com/abbasfaamarzi/roya"
Repository = "https://github.com/abbasfaamarzi/roya"

[tool.setuptools.packages.find]
include = ["roya*"]

[tool.setuptools.package-data]
roya = [
    "static/**/*",
    "templates/**/*",
    "py.typed",
]